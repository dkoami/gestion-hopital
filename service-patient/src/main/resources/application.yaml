spring:
  application:
    name: service-patient

  datasource:
    url: jdbc:mysql://localhost:3306/patientdb?createDatabaseIfNotExist=true
    username: root
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
      jakarta:
        persistence:
          validation:
            mode: none

server:
  port: 8887

logging:
  level:
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG