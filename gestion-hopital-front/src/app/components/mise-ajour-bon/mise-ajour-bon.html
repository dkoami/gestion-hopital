<div class="container-fluid px-4">
  <h1 class="mt-4">Modifier le bon de consultation</h1>
  <p class="text-muted">Bons &rsaquo; Modifier</p>

  <div class="row g-4">

    <!-- COLONNE GAUCHE : Formulaire -->
    <div class="col-lg-8">
      <div class="card border-0 shadow-sm">
        <div class="card-header bg-light py-3">
          <div class="d-flex align-items-center gap-2">
            <i class="fas fa-scroll text-secondary fs-5"></i>
            <span class="fw-bold">Informations du bon</span>
          </div>
        </div>

        <div class="card-body p-4">
          <form #f="ngForm" (ngSubmit)="onSubmit(f)">

            <!-- Patient : lecture seule -->
            <div class="mb-3">
              <label class="form-label text-secondary small">Patient</label>
              <input type="text" class="form-control" [value]="patientNom" disabled>
            </div>

            <!-- Type de consultation -->
            <div class="mb-3">
              <label class="form-label text-secondary small d-block">Type de consultation *</label>
              <div class="d-flex flex-wrap gap-2">
                @for (t of typesConsultation; track t) {
                  <button type="button"
                          class="btn rounded-pill px-3 py-1 btn-sm"
                          [class.btn-primary]="bon.typeconsultation === t"
                          [class.btn-outline-secondary]="bon.typeconsultation !== t"
                          (click)="selectType(t)">
                    {{ t }}
                  </button>
                }
              </div>
            </div>

            <!-- Désignation -->
            <div class="mb-3">
              <label for="designation" class="form-label text-secondary small">Désignation *</label>
              <input type="text" class="form-control" id="designation" name="designation"
                     [(ngModel)]="bon.designation" required>
            </div>

            <!-- Prix & Partie prenante -->
            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <label for="prix" class="form-label text-secondary small">Prix (FCFA) *</label>
                <input type="number" class="form-control" id="prix" name="prix"
                       [(ngModel)]="bon.prix" required min="0">
              </div>
              <div class="col-md-6">
                <label for="partiePrenante" class="form-label text-secondary small">Partie prenante</label>
                <select class="form-select" id="partiePrenante" name="nomPartiP"
                        [(ngModel)]="bon.nomPartiP">
                  @for (opt of optionsPartiePrenante; track opt) {
                    <option [value]="opt">{{ opt }}</option>
                  }
                </select>
              </div>
            </div>

            <!-- Boutons -->
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-warning text-white px-4"
                      [disabled]="f.invalid || !bon.typeconsultation">
                <i class="fas fa-save me-1"></i>Enregistrer les modifications
              </button>
              <button type="button" class="btn btn-secondary px-4" (click)="retourListe()">
                Annuler
              </button>
            </div>

          </form>
        </div>
      </div>
    </div>

    <!-- COLONNE DROITE : Récapitulatif -->
    <div class="col-lg-4">
      <div class="card border-0 shadow-sm">
        <div class="card-header bg-light py-3">
          <span class="fw-bold">Récapitulatif</span>
        </div>
        <div class="card-body p-4">

          <div class="d-flex justify-content-between align-items-center py-2 border-bottom">
            <span class="text-secondary">Patient</span>
            <span class="fw-medium">{{ patientNom || '—' }}</span>
          </div>

          <div class="d-flex justify-content-between align-items-center py-2 border-bottom">
            <span class="text-secondary">Type</span>
            <span class="fw-medium">{{ bon.typeconsultation || '—' }}</span>
          </div>

          <div class="d-flex justify-content-between align-items-center py-2 border-bottom">
            <span class="text-secondary">Partie prenante</span>
            <span class="fw-medium">{{ bon.nomPartiP }}</span>
          </div>

          <div class="d-flex justify-content-between align-items-center pt-3 mt-2">
            <span class="fs-4 fw-bold text-dark">Prix</span>
            <span class="fs-4 fw-bold text-success">
              {{ (bon.prix || 0) | number:'1.0-0' }} FCFA
            </span>
          </div>

        </div>
      </div>
    </div>

  </div>
</div>
