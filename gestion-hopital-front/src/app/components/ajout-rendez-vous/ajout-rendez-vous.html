<form #f="ngForm" (ngSubmit)="saveRendezVous(f)">
  <!-- Champs du Rendez-vous -->
  <div class="mb-3">
    <label for="texte" class="form-label">Objet / Motif</label>
    <input type="text" id="texte" name="texte" class="form-control" ngModel required />
  </div>

  <div class="row">
    <div class="col-md-6 mb-3">
      <label for="debut" class="form-label">Date & Heure Début</label>
      <input type="datetime-local" id="debut" name="debut" class="form-control" ngModel required />
    </div>

    <div class="col-md-6 mb-3">
      <label for="fin" class="form-label">Date & Heure Fin</label>
      <input type="datetime-local" id="fin" name="fin" class="form-control" ngModel required />
    </div>
  </div>

  <button type="submit" class="btn btn-primary" [disabled]="f.invalid">
    Enregistrer
  </button>
</form>
